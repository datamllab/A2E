[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-agent-smolagents"
version = "0.1.0"
description = "A2E smolagents agent — code-driven HF smolagents runner, dataset-agnostic via AgentBinding"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
    "ageneval-task-tau-bench>=0.1.0",
    "openinference-instrumentation-smolagents>=0.1.29",
    "smolagents>=1.24.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md"]
