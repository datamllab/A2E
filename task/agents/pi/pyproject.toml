[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-agent-pi"
version = "0.1.0"
description = "A2E Pi agent — dataset-agnostic AgentBinding runner powered by the Pi coding agent CLI"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md"]
