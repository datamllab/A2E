[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-agent-deepseek-harness"
version = "0.1.0"
description = "A2E dataset-agnostic runner for DeepSeek Harness"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = ["ageneval-task-core>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md", "VALIDATION.md"]
