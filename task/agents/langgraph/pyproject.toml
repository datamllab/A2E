[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-langgraph-agent"
version = "0.1.0"
description = "A2E LangGraph agent — multi-node state machine, dataset-agnostic via AgentBinding"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
    "ageneval-task-tau-bench>=0.1.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md"]
