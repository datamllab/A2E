[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-agent-llama-index"
version = "0.1.0"
description = "A2E llama-index agent — dataset-agnostic AgentBinding runner powered by LlamaIndex"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
    "openinference-instrumentation-llama-index>=0.1.0",
    "llama-index-core>=0.14.0",
    "llama-index-llms-openai-like>=0.2.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md"]
