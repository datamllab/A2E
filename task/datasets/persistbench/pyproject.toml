[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-persistbench"
version = "0.1.0"
description = "PersistBench (knowledge persistence) dataset adapter for A2E"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
    "datasets>=2.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]
