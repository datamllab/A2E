[project]
name = "a2e-client"
description = "LLM Observability"
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = { text = "MIT" }
keywords = [
  "Observability",
  "Monitoring",
  "Explainability",
]
authors = [
  { name = "Shanghai AI Lab", email = "a2e-devs@example.com" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
version = "2.3.1"
dependencies = [
  "httpx",
  "tqdm",
  "typing-extensions",
  "openinference-semantic-conventions",
  "openinference-instrumentation>=0.1.20",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
]

[project.urls]
Documentation = "https://example.com/docs/a2e/"
Issues = "https://github.com/a2e-ai/a2e/issues"
Source = "https://github.com/a2e-ai/a2e"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2e"]

[tool.hatch.build]
only-packages = true

[tool.ruff]
exclude = [
  "dist",
]
extend-include = ["*.ipynb"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]
"tests/**/*.py" = ["E501", "E731"]
"src/a2e/client/__generated__/v1/*.py" = ["E501"]

[tool.ruff.format]
line-ending = "native"

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
strict = true
exclude = [
  "dist/",
  "examples",
  "tests/canary",
  "scripts/",
  "src/a2e/client/helpers/sdk/",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportUnusedFunction = false
exclude = [
  "dist/",
  "examples",
  "tests/canary/",
  "scripts/",
  "src/a2e/client/helpers/sdk/",
  "**/.venv",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "tests",
]
