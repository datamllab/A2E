# Installed automatically as a DeepSeek Harness profile bundle by
# `dsh plugin --profile <profile> add <this-directory>`.
- id: tool-bash
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-pwsh
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-str-replace-editor
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

# Native Harness tools stay enabled by default and are part of the evaluated
# agent. Set A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS to a non-empty value only when
# an isolated validation needs to suppress all model-facing Harness tools.
- id: tool-jobs
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-fs
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-fs-search
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-skill
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-subagent-control
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-subagent-list-agents
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-subagent
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-subagent-fork
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-subagent-report
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-workflow
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-todo
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-goal
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-ralph
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- id: tool-web
  disabled: !!js Boolean(process.env.A2E_DEEPSEEK_DISABLE_BUILTIN_TOOLS)

- insert:
    - id: openinference-instrumentation-deepseek-harness
      name: openinference-instrumentation-deepseek-harness
      inject: [sessions, tools]
      disabled: !!js "['0', 'false', 'no', 'off'].includes((process.env.A2E_DEEPSEEK_MONITOR_ENABLED ?? 'true').trim().toLowerCase())"
